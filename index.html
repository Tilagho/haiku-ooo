<main id="page">
  <header class="noren-head" id="noren">
    <h1 class="sr">Haiku.ooo</h1>
    <div class="cr-row"><p class="cr-line">© 2026 Tiago Ramirez. All Rights Reserved. <button id="credits-btn" class="cr-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Credits"><span class="cr-w" data-t="Credits">Credits</span></button></p></div>
    <p class="jp" lang="ja">俳句の掲示板</p>
  </header>

  <div id="scroll" class="scroll" aria-label="the haiku scroll, newest first"></div>
  <!-- round 15.10g (t222u): the 5-7-5 chips are gone; the board ends with おわり / The End (15.10g4; periods dropped) + inquiries, shown only once the
       feed has reached the very first poem (src/feed.js adds .end to the .feed-more sentinel app.js puts just before this) -->
  <section class="scroll-end" aria-label="the end">
    <p class="end-jp" lang="ja">おわり</p>
    <!-- round 15.10g3 (t227u): just "The End." / "おわり。", all in the © row voice; 15.10g4 (t228u): periods dropped so both lines sit centred (the 。 left ~13px of empty em box on the right) -->
    <p class="end-en">The End</p>
    <!-- round 15.10g2 (t226u): plain text like the © row; the address is an inline link like Credits: mailto opens the mail app, a tap also copies it -->
    <p class="end-mail">Inquiries? Email us <a id="end-mail-a" class="end-mail-a" href="mailto:contact@haiku.ooo"><span class="cr-w" data-t="contact@haiku.ooo">contact@haiku.ooo</span></a></p>
  </section>
</main>

<button id="fab" class="fab" aria-haspopup="dialog" aria-label="write a haiku"><span class="sr">write a haiku</span></button>

<div id="bubble" class="bubble" hidden></div>
