<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="theme-color" content="#f4ecda">
<title>Haiku.ooo · only 5-7-5 may pass</title>
<meta name="description" content="A public scroll where you can only post if it's a haiku.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="src/style.css">
<link rel="stylesheet" href="src/compose.css">
</head>
<body>

<main id="page">
  <header class="noren-head" id="noren">
    <h1 class="sr">Haiku.ooo</h1>
    <p class="jp" lang="ja">俳句の掲示板</p>
  </header>

  <div id="scroll" class="scroll" aria-label="the haiku scroll, newest first"></div>
  <section class="scroll-foot" aria-label="the rule">
    <p class="rule"><b class="chip c1">5</b><b class="chip c2">7</b><b class="chip c3">5</b></p>
  </section>
  <footer class="credit"><p>type: ChiKareGo2 &amp; FindersKeepers by Giles Booth (CC BY)</p></footer>
</main>

<button id="fab" class="fab" aria-haspopup="dialog" aria-label="write a haiku"><span class="sr">write a haiku</span></button>

<div id="bubble" class="bubble" hidden></div>

<script type="module" src="src/app.js"></script>
</body>
</html>
